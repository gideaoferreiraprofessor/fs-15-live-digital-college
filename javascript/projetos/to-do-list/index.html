<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/css/bootstrap.min.css"
        integrity="sha512-Ez0cGzNzHR1tYAv56860NLspgUGuQw16GiOOp/I2LuTmpSK9xDXlgJz3XN4cnpXWDmkNBKXR/VDMTCnAaEooxA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>To-Do List</title>
</head>
<body>
    <h3 class="text-center mt-5">Lista de tarefas</h3>
    <div class="mt-5">
        <form id="form-task"  style="width: 400px; margin: 0 auto;">
            <div class="input-group">
                <input class="form-control" type="text" id="input-task" placeholder="Digite uma tarefa">
                <button class="btn btn-success" id="btn-add-task" type="button">Adicionar</button>
            </div>
        </form>

        <table class="table table-striped mt-5"  style="width: 600px; margin: 0 auto;">
            <thead>
                <tr>
                    <th scope="col">Tarefa</th>
                    <th scope="col">Status</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody id="list-task">
            </tbody>
        </table>

        <div class="modal fade" id="taskDoneModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="taskDoneModalLabel">Concluir atividade</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="alert alert-warning text-center">Tem certeza que deseja concluir esta atividade?</p>
                        <h4 class="text-center" id="taskDoneModalContent"></h4>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm" id="btnTaskDoneConfirm">Concluir</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="taskEditModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="taskEditModalLabel">Editar atividade</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="alert alert-warning text-center">Tem certeza que deseja editar esta atividade?</p>
                        <h4 class="text-center" id="taskEditModalContent"></h4>
                        <form>
                            <input class="form-control" type="text" id="input-task-edit" placeholder="Digite uma tarefa">
                            <select name="status" id="select-status" class="form-select mt-3">
                                <option value="done">Concluído</option>
                                <option value="doing">Em andamento</option>
                            </select>
                        </form>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm" id="btnTaskEditConfirm">Editar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
