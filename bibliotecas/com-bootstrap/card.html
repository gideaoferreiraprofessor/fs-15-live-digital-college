<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/css/bootstrap.min.css"
        integrity="sha512-Ez0cGzNzHR1tYAv56860NLspgUGuQw16GiOOp/I2LuTmpSK9xDXlgJz3XN4cnpXWDmkNBKXR/VDMTCnAaEooxA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Bootstrap Card</title>
</head>
<body>
    <h3>Classes para Card</h3>
    <a href="https://getbootstrap.com/docs/5.0/components/card/">Bootstrap Cards</a>
    <hr>
    <div class="card" style="width: 18rem;">
        <div class="card-header">
            Cabeçalho do Card
        </div>
        <img src="./img-exemple.jpg" class="card-img-top" alt="Imagem do Card">
        <div class="card-body">
            <h5 class="card-title">Título do Card</h5>
            <h6 class="card-subtitle text-muted">Subtítulo do Card</h6>
            <p class="card-text">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                Minus voluptatem aliquam consequuntur ab expedita vero
                qui in aut repellat laudantium.
            </p>
        </div>
        <div class="card-footer">
            Rodapé do Card
        </div>
    </div>
</body>
</html>
