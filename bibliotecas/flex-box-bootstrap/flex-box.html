<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Flex Box Bootstrap</title>
</head>

<body>
    <h3>Flex Box Bootstrap</h3>
    <a href="https://getbootstrap.com/docs/5.0/utilities/flex/" target="_blank">Documentação</a>
    <hr>
    <p><small> d-flex </small></p>
    <div class="bg-info d-flex">
        <p class="bg-primary"> Elemento 1 </p>
        <p class="bg-dark text-white"> Elemento 2 </p>
    </div>
    <hr>
    <p><small>d-flex justify-content-center </small></p>
    <div class="bg-info d-flex justify-content-center">
        <p class="bg-primary"> Elemento 1 </p>
        <p class="bg-dark text-white"> Elemento 2 </p>
    </div>
    <hr>
    <p><small>d-flex justify-content-evenly </small></p>
    <div class="bg-info d-flex justify-content-evenly">
        <p class="bg-primary"> Elemento 1 </p>
        <p class="bg-dark text-white"> Elemento 2 </p>
    </div>
    <hr>
    <p><small>d-flex justify-content-around </small></p>
    <div class="bg-info d-flex justify-content-around">
        <p class="bg-primary"> Elemento 1 </p>
        <p class="bg-dark text-white"> Elemento 2 </p>
    </div>
    <hr>
    <p><small>d-flex justify-content-between </small></p>
    <div class="bg-info d-flex justify-content-between">
        <p class="bg-primary"> Elemento 1 </p>
        <p class="bg-dark text-white"> Elemento 2 </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
        integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
